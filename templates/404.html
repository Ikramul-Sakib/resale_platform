{% extends "base.html" %}
{% block title %}Page Not Found — ValuLens{% endblock %}
{% block meta_description %}The page you're looking for doesn't exist.{% endblock %}
{% block content %}
<div class="container error-page">
    <div class="error-page__content">
        <h1 class="error-page__code">404</h1>
        <h2 class="error-page__title">Page not found</h2>
        <p class="error-page__message">The page you're looking for doesn't exist or has been moved.</p>
        <a href="/" class="btn btn--primary">Back to Home</a>
    </div>
</div>
{% endblock %}
