{% load static %}
<nav class="navbar">
    <div class="container navbar__inner">
        <a href="/" class="navbar__brand">
            <span class="navbar__logo">◈</span>
            <span class="navbar__name">ValuLens</span>
        </a>

        <div class="navbar__links hide-mobile">
            <a href="/#how-it-works" class="navbar__link">How it works</a>
            <a href="/pricing-guides/" class="navbar__link">Pricing Guides</a>
            <a href="/fee-calculator/" class="navbar__link">Fee Calculator</a>
            <a href="/resale-index/" class="navbar__link">Resale Index</a>
        </div>

        <div class="navbar__actions">
            {% if user.is_authenticated %}
            <a href="{% url 'accounts:dashboard' %}" class="navbar__link hide-mobile">Dashboard</a>
            <a href="{% url 'accounts:logout' %}" class="navbar__link hide-mobile" style="color: var(--color-text-muted);">Log out</a>
            <a href="/scan/" class="btn btn--primary btn--sm">Scan Item</a>
            {% else %}
            <a href="{% url 'accounts:login' %}" class="navbar__link hide-mobile">Log in</a>
            <a href="{% url 'accounts:register' %}" class="btn btn--outline btn--sm hide-mobile">Sign up</a>
            <a href="/scan/" class="btn btn--primary btn--sm">Scan Item</a>
            {% endif %}
        </div>
    </div>

    {# Mobile bottom nav #}
    <div class="mobile-nav show-mobile">
        <a href="/" class="mobile-nav__item {% if request.path == '/' %}mobile-nav__item--active{% endif %}">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
            <span>Inventory</span>
        </a>
        <a href="/scan/" class="mobile-nav__item {% if '/scan/' in request.path %}mobile-nav__item--active{% endif %}">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8V6a3 3 0 0 1 3-3h2M16 3h2a3 3 0 0 1 3 3v2M21 16v2a3 3 0 0 1-3 3h-2M8 21H6a3 3 0 0 1-3-3v-2"/></svg>
            <span>Scan</span>
        </a>
        <a href="/accounts/dashboard/" class="mobile-nav__item {% if '/accounts/' in request.path %}mobile-nav__item--active{% endif %}">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 20.5c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5"/></svg>
            <span>Profile</span>
        </a>
    </div>
</nav>
